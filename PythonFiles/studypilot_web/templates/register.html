{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<header class="topbar">
    <h1>Create an account</h1>
    <p>Your homework, notes and timetable stay private to you</p>
</header>

<section class="card">
    <form method="post" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <div class="form-grid">
            <div class="field">
                <label for="username">Username (3-20 letters, numbers or underscores)</label>
                <input id="username" name="username" required minlength="3" maxlength="20" autocomplete="username" value="{{ username }}">
            </div>
            <div class="field">
                <label for="password">Password (at least 8 characters)</label>
                <input id="password" type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="confirm">Confirm password</label>
                <input id="confirm" type="password" name="confirm" required minlength="8" maxlength="128" autocomplete="new-password">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit">Register</button>
        </div>
    </form>
    <p>Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
</section>
{% endblock %}
