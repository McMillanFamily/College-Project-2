{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<header class="topbar">
    <h1>Log in</h1>
    <p>Sign in to your Study Pilot account</p>
</header>

<section class="card">
    <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <div class="form-grid">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" required maxlength="20" autocomplete="username" value="{{ username }}">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" required maxlength="128" autocomplete="current-password">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit">Log in</button>
        </div>
    </form>
    <p>No account yet? <a href="{{ url_for('register') }}">Register</a>.</p>
</section>
{% endblock %}
