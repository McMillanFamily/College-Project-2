name: Auto-Resolve Merge Conflicts & Update Main

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - testing # Automatically run when testing is updated

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository (targets 'main' explicitly)
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Configure Git Bot
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3. Attempt to merge 'testing' into 'main'
      # Using '|| true' allows the workflow to continue to the resolver step if conflicts arise
      - name: Merge testing branch
        run: |
          git fetch origin Testing
          git merge origin/Testing --no-commit --no-ff || echo "Merge conflicts detected. Proceeding to auto-resolution..."

      # 4. Run the Conflict Resolver Action
      - name: Resolve conflicts
        id: resolve
        uses: VeyronSakai/conflict-resolver@v0.5.2

      # 5. Handle the results and push
      - name: Handle resolution results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNRESOLVED_FILES: ${{ steps.resolve.outputs.unresolved-files }}
        run: |
          # Check if there are still unresolved files left by the action
          if [ -n "$UNRESOLVED_FILES" ]; then
            echo "❌ Error: Unable to automatically resolve all conflicts."
            echo "Remaining conflicted files: $UNRESOLVED_FILES"
            git merge --abort
            exit 1
          fi

          # Check if there are changes to commit (either resolved conflicts or a clean merge)
          if ! git diff --cached --quiet; then
            echo "✅ Merge successful (with or without auto-resolved conflicts). Committing changes..."
            git commit -m "chore: auto-update main from testing [skip ci]"
            git push origin main
          else
            echo "ℹ️ No changes to merge. 'main' is already up to date with 'testing'."
          fi
