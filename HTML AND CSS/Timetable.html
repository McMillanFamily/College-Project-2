<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Pilot | Timetable</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h2>📚 Study Pilot</h2>
        <nav>
            <a href="./Study%20App.html">🏠 Dashboard</a>
            <a href="Timetable.html" class="active">📅 Timetable</a>
        	<a href="./Assessments.html"</a>📝 Assessments</a>
            <a href="Homework.html">📚 Homework</a>
            <a href="Attendance.html">📊 Attendance</a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1>My Timetable</h1>
            <p>Add your own classes, days and times</p>
        </header>

        <section class="card">
            <h2>Add a class</h2>

            <form id="timetable-form">
                <div class="form-grid">
                    <div class="field">
                        <label>Subject or class</label>
                        <input name="subject" required placeholder="Enter subject">
                    </div>

                    <div class="field">
                        <label>Day</label>
                        <select name="day" required>
                            <option value="">Choose day</option>
                            <option>Monday</option>
                            <option>Tuesday</option>
                            <option>Wednesday</option>
                            <option>Thursday</option>
                            <option>Friday</option>
                            <option>Saturday</option>
                            <option>Sunday</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Start time</label>
                        <input type="time" name="start" required>
                    </div>

                    <div class="field">
                        <label>End time</label>
                        <input type="time" name="end" required>
                    </div>

                    <div class="field full">
                        <label>Room or location (optional)</label>
                        <input name="room" placeholder="Add room or location">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit">Add to timetable</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>My classes</h2>
            <div id="timetable-list" class="item-list"></div>
        </section>
    </main>
</div>
</body>
</html>
