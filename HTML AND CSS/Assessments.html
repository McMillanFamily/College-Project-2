<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Pilot | Assessments</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h2>📚 Study Pilot</h2>
        <nav>
            <a href="./Study%20App.html">Dashboard</a>">🏠 Dashboard</a>
            <a href="Timetable.html">📅 Timetable</a>
            <a href="./Assessments.html" class="active">📝 Assessments</a>
            <a href="Homework.html">📚 Homework</a>
            <a href="Attendance.html">📊 Attendance</a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1>My Assessments</h1>
            <p>Add tests, assignments and grades</p>
        </header>

        <section class="card">
            <h2>Add an assessment</h2>

            <form id="assessment-form">
                <div class="form-grid">
                    <div class="field">
                        <label>Assessment name</label>
                        <input name="name" required placeholder="Enter assessment name">
                    </div>

                    <div class="field">
                        <label>Subject</label>
                        <input name="subject" placeholder="Enter subject">
                    </div>

                    <div class="field">
                        <label>Assessment date</label>
                        <input type="date" name="date" required>
                    </div>

                    <div class="field">
                        <label>Grade (optional)</label>
                        <input name="grade" placeholder="Add grade when received">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit">Add assessment</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>My assessments</h2>
            <div id="assessment-list" class="item-list"></div>
        </section>
    </main>
</div>
</body>
</html>
