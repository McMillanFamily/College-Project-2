{% extends "base.html" %}
{% block content %}
<h1>Create an account</h1>
<form method="post" action="{{ url_for('register') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <p>
    <label for="username">Username</label><br>
    <input id="username" name="username" value="{{ username }}" maxlength="20"
           autocomplete="username" required autofocus>
    <br><small>3-20 characters: letters, numbers or underscores.</small>
  </p>
  <p>
    <label for="password">Password</label><br>
    <input id="password" name="password" type="password" minlength="8" maxlength="128"
           autocomplete="new-password" required>
    <br><small>At least 8 characters.</small>
  </p>
  <p>
    <label for="confirm">Confirm password</label><br>
    <input id="confirm" name="confirm" type="password"
           autocomplete="new-password" required>
  </p>
  <button type="submit">Create account</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
{% endblock %}
